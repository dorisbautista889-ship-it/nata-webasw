name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'lambda_function.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Empaquetar código Python
      run: zip -r lambda.zip lambda_function.py

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2  # Cambia esto si tu Lambda está en otra región

    - name: Actualizar AWS Lambda
      run: aws lambda update-function-code --function-name api-nata-web --zip-file fileb://lambda.zip
